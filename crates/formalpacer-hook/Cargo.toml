[package]
name = "formalpacer-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What runs inside a game for FormalPacer: game detection, the limiter, the overlay and its hotkey."

[dependencies]
formalpacer-shm.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
