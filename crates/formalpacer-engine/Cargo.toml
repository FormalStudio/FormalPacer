[package]
name = "formalpacer-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Finds the running game and the display it is on, and decides the frame rate to hold."

[dependencies]
drm = "0.14"
flume.workspace = true
formalpacer-shm.workspace = true
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
x11rb = { version = "0.13", features = ["randr"] }

[lints]
workspace = true
