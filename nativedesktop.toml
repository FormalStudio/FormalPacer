[app]
id = "dev.formalsnake.formalpacer"
display_name = "FormalPacer"
icon = "packaging/linux/dev.formalsnake.formalpacer.png"

# Beside formalpacer.exe: the Vulkan layer, the Direct3D and OpenGL hook, and Intel's PresentMon
# (MIT), which scripts/install-windows.ps1 downloads into target/windows.
[windows]
files = [
    "target/release/formalpacer_layer.dll",
    "target/release/formalpacer_inject.dll",
    "target/windows/PresentMon.exe",
]

# Updates: `nd release keygen` prints public_key; the feed is any static host serving the
# directory `nd release` writes (`nd release serve` for local tests).
# [updates]
# feed = "https://updates.example.com/formalpacer"
# public_key = "..."
